services:
  mysql:
    image: mysql:8.4
    container_name: zelo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: chat_zelo
    ports:
      - "3306:3306"
    volumes:
      - zelo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zelo_mysql_data: